# Opcional: docker compose -f compose.yaml -f compose.pgadmin.yaml up -d pgadmin
services:
  pgadmin:
    image: dpage/pgadmin4:9.19

    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:?Define PGADMIN_DEFAULT_EMAIL en .env para usar pgAdmin web}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:?Define PGADMIN_DEFAULT_PASSWORD en .env para usar pgAdmin web}

    ports:
      - "127.0.0.1:5050:80"

    volumes:
      - pgadmin_data:/var/lib/pgadmin

    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgadmin_data:
